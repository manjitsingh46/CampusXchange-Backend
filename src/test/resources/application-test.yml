spring:
  application:
    name: campusxchange-backend-test

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-testing-purposes-32-chars
    expiration: 86400000
    refresh-expiration: 604800000

server:
  port: 8080

logging:
  level:
    root: INFO
    com.campusxchange: DEBUG
